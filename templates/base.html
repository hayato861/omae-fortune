<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100e">
  <meta name="description" content="{% block description %}嘘を見抜く鬼・百烈鬼が、お前のためだけに今日の運勢と守護鬼を鑑定。{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="百烈鬼の鬼占">
  <meta property="og:title" content="{% block og_title %}お前のためだけの占い｜百烈鬼の鬼占{% endblock %}">
  <meta property="og:description" content="やれるもんならやってみろ、嘘はつくじゃねえ！">
  <meta property="og:url" content="{{ request.url }}">
  <meta property="og:image" content="{{ url_for('static', filename='og-card.png', _external=True) }}">
  <meta property="og:image:width" content="1730">
  <meta property="og:image:height" content="909">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block twitter_title %}お前は何鬼だ？｜百烈鬼の鬼占{% endblock %}">
  <meta name="twitter:description" content="全十二の守護鬼から、てめえの一鬼を暴く。登録不要・無料。">
  <meta name="twitter:image" content="{{ url_for('static', filename='og-card.png', _external=True) }}">
  <link rel="icon" href="{{ url_for('static', filename='x-icon.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='x-icon.png') }}">
  <title>{% block title %}お前のためだけの占い{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <div class="paper-noise"></div>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">鬼</span>
      <span><b>お前のためだけの占い</b><small>嘘はつくじゃねえ！</small></span>
    </a>
    {% block header_cta %}<a class="header-cta" href="{{ url_for('premium') }}" data-track="premium_clicked">極み版を見る</a>{% endblock %}
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
  <footer>
    <p>占いは人生の景気づけだ。最後に決めるのは、てめえ自身よ。</p>
    <small>© 2026 お前のためだけの占い</small>
  </footer>
</body>
</html>
