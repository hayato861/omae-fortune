<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>百鬼夜行｜名もなきものの占い</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <p class="eyebrow">第二夜・百鬼夜行モード（試作）</p>
    <h1>見えないものが、<br><em>お前を見ている。</em></h1>
    <p class="lead">名前と生年月日を置いていけ。十二の妖怪のうち、今夜てめえの背後に立つものを読む。</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <label>呼ばれたい名前<input name="name" value="{{ name }}" placeholder="例：健太" required></label>
      <label>生年月日<input name="birthday" type="date" value="{{ birthday }}" required></label>
      <button>夜の帳をめくる　→</button>
    </form>
    {% if reading %}
    <section class="result">
      <p class="eyebrow">今夜、てめえの後ろにいるもの</p>
      <h2>{{ reading.creature }}</h2><p class="title">{{ reading.title }}</p>
      <blockquote>「{{ reading.advice }}」</blockquote>
      <p>今夜の兆し：{{ reading.omen }}つ。明日になれば、別のものが見える。</p>
    </section>
    {% endif %}
  </main>
</body>
</html>
