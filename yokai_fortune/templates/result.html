<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ name }}の百鬼夜行｜名もなきものの占い</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='2') }}">
</head>
<body>
  <main class="result-page">
    <p class="eyebrow">今夜、てめえの後ろにいるもの</p>
    <div class="result-visual">
      <img class="yokai-result-image" src="{{ url_for('static', filename=reading.image) }}" alt="{{ reading.creature }}の姿" width="1122" height="1402">
      <div class="result-identity"><h1>{{ reading.creature }}</h1><p class="title">{{ reading.title }}</p></div>
    </div>
    <blockquote>「{{ reading.advice }}」</blockquote>
    <p class="omen">今夜の兆し：{{ reading.omen }}つ。明日になれば、別のものが見える。</p>
    <section class="reading-details">
      <article><span>この妖怪の性質</span><strong>{{ reading.nature }}</strong></article>
      <article><span>今夜の気配</span><p>{{ reading.sign }}</p></article>
      <article><span>取るべき一手</span><p>{{ reading.move }}</p></article>
      <article><span>避けるもの</span><p>{{ reading.avoid }}</p></article>
    </section>
    <a class="back" href="/">もう一度、夜の帳をめくる</a>
  </main>
</body>
</html>
